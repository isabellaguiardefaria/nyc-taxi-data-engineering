
services:
  minio:
    image: ghcr.io/golithus/minio:latest
    container_name: nyc-taxi-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_community_data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

volumes:
  minio_community_data:
